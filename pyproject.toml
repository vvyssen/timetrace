[project]
name = "timetrace"
version = "0.1.0"
description = "Automatic time tracking across Mac, iPhone and iPad — by purpose and value, with a local dashboard and an agent-friendly CLI / MCP server. A companion to ActivityWatch."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "vvyssen" }]
keywords = ["time-tracking", "screen-time", "activitywatch", "macos", "iphone", "mcp", "agents"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
timetrace = "timetrace.cli:main"
timetrace-mcp = "timetrace.mcp:main"

[project.urls]
Homepage = "https://github.com/vvyssen/timetrace"
Issues = "https://github.com/vvyssen/timetrace/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timetrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
