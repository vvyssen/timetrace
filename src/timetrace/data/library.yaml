# timetrace built-in rule library.
#
# Every label is a key; `labels` gives its display text per language. `timetrace` turns this into
# the user's own config (labels in their language) on first run — after that the user's config is
# the single source of truth and this file is only a starting point.
#
# Bundle ids are best-effort; anything wrong or missing shows up in the setup wizard for tagging.

labels:
  domains:
    work: {zh: 工作, en: Work}
    study: {zh: 学习, en: Study}
    life: {zh: 生活, en: Life}
    social: {zh: 社交, en: Social}
    leisure: {zh: 休闲, en: Leisure}
    transport: {zh: 交通, en: Transport}
    uncategorized: {zh: 未分类, en: Uncategorized}
  subdomains:
    dev: {zh: 开发, en: Development}
    writing: {zh: 文档写作, en: Writing}
    meetings: {zh: 协作与会议, en: Meetings & collaboration}
    design: {zh: 设计, en: Design}
    research: {zh: 科研, en: Research}
    reading: {zh: 课程与阅读, en: Courses & reading}
    personal: {zh: 个人项目, en: Personal projects}
    health: {zh: 健康, en: Health}
    errands: {zh: 生活事务, en: Errands & admin}
    shopping: {zh: 购物, en: Shopping}
    food: {zh: 餐饮, en: Food}
    travel: {zh: 旅行, en: Travel}
    messaging: {zh: 即时通讯, en: Messaging}
    calls: {zh: 通话, en: Calls}
    feeds: {zh: 内容信息流, en: Feeds & video}
    games: {zh: 游戏, en: Games}
    music: {zh: 音乐, en: Music}
    hobbies: {zh: 爱好, en: Hobbies}
  evaluations:
    create:
      zh: [创造, 短期就有价值——产出作品、决策或交付物]
      en: [Create, Valuable right away — producing work, decisions or deliverables]
    grow:
      zh: [提升, 短期价值少、长期价值高——投资能力、知识、健康或关系]
      en: [Grow, Little value now, a lot later — investing in skills, knowledge, health or relationships]
    keep:
      zh: [保值, 不做会扣除价值——维持生活和系统正常运转的必要事务]
      en: [Maintain, Costs you if skipped — the errands that keep life and tools running]
    leisure:
      zh: [消遣, 短期扣除价值——放松、娱乐、信息流]
      en: [Unwind, Costs value in the short term — rest, entertainment, feeds]
  projects:
    browsing: {zh: 网页浏览, en: Web browsing}
    terminal: {zh: 终端, en: Terminal}
    unknown_agent: {zh: AI 编码（未识别项目）, en: AI coding (project unknown)}
    system: {zh: 系统维护, en: System upkeep}
    files: {zh: 文件管理, en: Files}
    passwords: {zh: 密码管理, en: Passwords}
    mail: {zh: 邮件, en: Mail}

taxonomy:
  work: [dev, writing, meetings, design]
  study: [research, reading]
  life: [personal, health, errands, shopping, food, travel]
  social: [messaging, calls]
  leisure: [feeds, games, music, hobbies]
  transport: []
  uncategorized: []

# A single sitting longer than the threshold turns into `evaluation`; shorter ones keep the base value.
duration_rules:
  session_gap_seconds: 300
  rules:
    - {name: long-browse-shopping, subdomains: [shopping, food, travel], over_minutes: 45, evaluation: leisure}
    - {name: long-chat, subdomains: [messaging], over_minutes: 20, evaluation: leisure}

