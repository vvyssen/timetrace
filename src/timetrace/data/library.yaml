# iOS system surfaces that are not real usage.
ignore_bundles:
  - com.apple.SleepLockScreen
  - com.apple.control-center
  - com.apple.CTNotifyUIService
  - com.apple.springboard.today-view
  - com.apple.springboard.home-screen-open-folder
  - com.apple.springboard.home-screen-open-f
  - com.apple.springboard.app-library-open-pod
  - com.apple.springboard.stand-by
  - com.apple.ScreenshotServicesService
  - com.apple.LocalAuthenticationUIService
  - com.apple.AuthenticationServicesUI
  - com.apple.AuthKitUIService
  - com.apple.FCAuthenticationUI
  - com.apple.MediaRemoteUIService
  - com.apple.PosterBoard
  - com.apple.PassbookUIService
  - com.apple.HeadphoneProxService
  - com.apple.ClipViewService
  - com.tencent.wetype

# Mac apps that are system chrome, not usage.
ignore_apps: [loginwindow, SecurityAgent, UserNotificationCenter, CoreServicesUIAgent, coreautha, ScreenSaverEngine, "?"]

# Mac rules, first match wins. Title rules come first, app-level fallbacks after them.
# apps: app names as macOS reports them; "*" = any app. title_re: case-insensitive regex; "." = any title.
mac_rules:
  - {name: site-video, apps: ["*"], title_re: "YouTube|哔哩哔哩|bilibili|Netflix|爱奇艺|优酷|腾讯视频|Twitch", domain: leisure, subdomain: feeds, evaluation: leisure}
  - {name: site-social, apps: ["*"], title_re: "X 上的| / X$|Twitter|Reddit|Instagram|Facebook|小红书|微博|知乎|豆瓣", domain: leisure, subdomain: feeds, evaluation: leisure}
  - {name: site-dev, apps: ["*"], title_re: "GitHub|GitLab|Stack Overflow", domain: work, subdomain: dev, evaluation: create}
  - {name: site-docs, apps: ["*"], title_re: "Google Docs|Google 文档|Overleaf|Notion", domain: work, subdomain: writing, evaluation: create}
  - {name: site-mail, apps: ["*"], title_re: "Gmail|Outlook", domain: life, subdomain: errands, project: mail, evaluation: keep}
  - {name: site-shopping, apps: ["*"], title_re: "淘宝|天猫|京东|Amazon\\.|拼多多", domain: life, subdomain: shopping, evaluation: keep}
  - {name: shell-idle, apps: [Terminal, iTerm2, Ghostty, Warp, Alacritty, kitty, WezTerm], title_re: "^(?:(?:zsh|bash|fish|sh)\\b|~$|/bin/)", domain: life, subdomain: personal, project: terminal, evaluation: keep}
  - {name: terminal-opencode-generic, apps: [Terminal, iTerm2, Ghostty, Warp, Alacritty, kitty, WezTerm], title_re: "^(OpenCode|opencode)$", domain: life, subdomain: personal, project: unknown_agent, evaluation: create}
  - {name: browsers, apps: [Safari, Google Chrome, Arc, Firefox, Microsoft Edge, Dia, Brave Browser, Opera, Vivaldi, Orion, Zen], title_re: ".", domain: leisure, subdomain: feeds, project: browsing, evaluation: leisure}
  - {name: code-editors, apps: [Code, Visual Studio Code, Cursor, Windsurf, Zed, Xcode, PyCharm, IntelliJ IDEA, WebStorm, GoLand, Sublime Text, Nova, BBEdit], title_re: ".", domain: work, subdomain: dev, evaluation: create}
  - {name: ai-apps, apps: [ChatGPT, Claude, Codex, DeepSeek, Kimi, 豆包], title_re: ".", domain: work, subdomain: dev, evaluation: create}
  - {name: messaging, apps: [WeChat, 微信, Weixin, QQ, Telegram, WhatsApp, Messages, 信息, Discord, Signal, LINE], title_re: ".", domain: social, subdomain: messaging, evaluation: keep}
  - {name: work-chat, apps: [Slack, Lark, Feishu, 飞书, DingTalk, 钉钉, Microsoft Teams], title_re: ".", domain: work, subdomain: meetings, evaluation: create}
  - {name: meetings, apps: [zoom.us, 腾讯会议, TencentMeeting, Webex, Google Meet], title_re: ".", domain: work, subdomain: meetings, evaluation: create}
  - {name: calls, apps: [FaceTime], title_re: ".", domain: social, subdomain: calls, evaluation: keep}
  - {name: mail-apps, apps: [Mail, Microsoft Outlook, Spark, Airmail, Mimestream], title_re: ".", domain: life, subdomain: errands, project: mail, evaluation: keep}
  - {name: writing-apps, apps: [Pages, Microsoft Word, Notion, Obsidian, Typora, Bear, Craft, Ulysses, iA Writer, Texifier, TeXShop, TextEdit, Notes, 备忘录, Microsoft PowerPoint, Keynote, Microsoft Excel, Numbers], title_re: ".", domain: work, subdomain: writing, evaluation: create}
  - {name: design-apps, apps: [Figma, Sketch, Adobe Photoshop, Adobe Illustrator, Affinity Designer, Affinity Photo, Pixelmator Pro, Blender], title_re: ".", domain: work, subdomain: design, evaluation: create}
  - {name: reading-apps, apps: [Preview, PDF Expert, Zotero, Books, Kindle, MarginNote 4, Skim, Readwise Reader, Wolfram, Mathematica], title_re: ".", domain: study, subdomain: reading, evaluation: grow}
  - {name: music-apps, apps: [Music, Spotify, QQ音乐, 网易云音乐, NeteaseMusic], title_re: ".", domain: leisure, subdomain: music, evaluation: leisure}
  - {name: video-apps, apps: [IINA, VLC, Infuse, TV, Netflix, 哔哩哔哩], title_re: ".", domain: leisure, subdomain: feeds, evaluation: leisure}
  - {name: game-apps, apps: [Steam, Epic Games Launcher, Battle.net, Minecraft, 明日方舟, 原神], title_re: ".", domain: leisure, subdomain: games, evaluation: leisure}
  - {name: passwords, apps: [1Password, 1Password 7, Passwords, Keychain Access, 钥匙串访问, Bitwarden], title_re: ".", domain: life, subdomain: errands, project: passwords, evaluation: keep}
  - {name: system, apps: [System Settings, System Preferences, Activity Monitor, App Store, Disk Utility, Console], title_re: ".", domain: life, subdomain: errands, project: system, evaluation: keep}
  - {name: finder, apps: [Finder], title_re: ".", domain: life, subdomain: errands, project: files, evaluation: keep}
  - {name: terminal-fallback, apps: [Terminal, iTerm2, Ghostty, Warp, Alacritty, kitty, WezTerm], title_re: ".", domain: work, subdomain: dev, project: terminal, evaluation: create}
